<main class="new-survey">
  <article class="new-survey__card">
    <header class="new-survey__card-header">
      <span class="new-survey__card-header-status">Draft</span>
      <div class="new-survey__card-header-title-row">
        <h2 class="new-survey__title">New survey</h2>
        <button class="new-survey__card-header-action" type="button">Cancel</button>
      </div>
    </header>

    <app-new-survey-form></app-new-survey-form>

    <p class="new-survey__card-body"></p>
    <footer class="new-survey__card-footer"></footer>
  </article>
</main>
